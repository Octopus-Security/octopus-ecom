# Portainer git stack. Pushing to main ships to production (estate rule).
#
# A stack variable reaches the container ONLY if it is listed under `environment:`
# here, so every variable the app reads is listed. Every credential is optional:
# without them the service runs in DRY_RUN with stubs, and credentials can be
# entered sealed in the panel instead.
services:
  octopus-ecom:
    build:
      context: .
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    container_name: octopus-ecom
    restart: unless-stopped
    # Loopback only; the reverse proxy reaches it over the shared network.
    ports:
      - "127.0.0.1:3050:3050"
    volumes:
      - ecom_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3050
      - DATA_DIR=/app/data
      - AUTH_MODE=sso
      - OWNER_USERNAMES=${OWNER_USERNAMES}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://octopus-auth:3002}
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-https://auth.octopustechnology.net}
      # Second, subtractive access gate; must match the app's slug in the auth service.
      - APP_ACCESS_SLUG=${APP_ACCESS_SLUG:-ecom}
      # REQUIRED in production (>=16 chars): seals every stored credential.
      - ECOM_SECRET=${ECOM_SECRET}
      - DRY_RUN=${DRY_RUN:-true}
      - DAILY_SPEND_CAP=${DAILY_SPEND_CAP:-5}
      - MARGIN_FLOOR=${MARGIN_FLOOR:-2}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PRINTIFY_API_TOKEN=${PRINTIFY_API_TOKEN:-}
      - PRINTIFY_SHOP_ID=${PRINTIFY_SHOP_ID:-}
      - PRINTIFY_MAX_UPLOAD_BYTES=${PRINTIFY_MAX_UPLOAD_BYTES:-}
      - ETSY_API_KEY=${ETSY_API_KEY:-}
      - ETSY_SHARED_SECRET=${ETSY_SHARED_SECRET:-}
      - ETSY_REDIRECT_URI=${ETSY_REDIRECT_URI:-}
      - ETSY_QPS=${ETSY_QPS:-}
      - ETSY_QPD=${ETSY_QPD:-}
      - ETSY_QPD_RESERVE=${ETSY_QPD_RESERVE:-20}
      - PUBLISH_POLL_ATTEMPTS=${PUBLISH_POLL_ATTEMPTS:-}
      - PUBLISH_POLL_MS=${PUBLISH_POLL_MS:-}
      - ETSY_SKIP_PRINTIFY_SHOP_MATCH=${ETSY_SKIP_PRINTIFY_SHOP_MATCH:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - ROUTER_PATH=${ROUTER_PATH:-}
      - LLM_MODEL_CHEAP=${LLM_MODEL_CHEAP:-}
      - LLM_MODEL_STANDARD=${LLM_MODEL_STANDARD:-}
      - LLM_MODEL_DEEP=${LLM_MODEL_DEEP:-}
      - LLM_PRICE_IN_PER_M=${LLM_PRICE_IN_PER_M:-}
      - LLM_PRICE_OUT_PER_M=${LLM_PRICE_OUT_PER_M:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-}
      - IMAGE_QUALITY=${IMAGE_QUALITY:-}
      - IMAGE_UPSCALE=${IMAGE_UPSCALE:-}
      - PRINT_MIN_COVERAGE=${PRINT_MIN_COVERAGE:-}
      - PRINT_FIT=${PRINT_FIT:-}
      - BATCH_CONCURRENCY=${BATCH_CONCURRENCY:-}
      - BATCH_MAX_COUNT=${BATCH_MAX_COUNT:-}
      - REFUND_LOOKBACK_DAYS=${REFUND_LOOKBACK_DAYS:-}
      - WATCH_INTERVAL_MINUTES=${WATCH_INTERVAL_MINUTES:-}
      - WATCH_ZERO_SALES_VIEWS=${WATCH_ZERO_SALES_VIEWS:-}
      - WATCH_VIEW_DROP_PCT=${WATCH_VIEW_DROP_PCT:-}
      - WATCH_VIEW_DROP_MIN_PREV=${WATCH_VIEW_DROP_MIN_PREV:-}
    networks:
      - octopus_network

volumes:
  ecom_data:

networks:
  octopus_network:
    external: true
